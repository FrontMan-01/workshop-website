<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>start.here: a free workshop, one level at a time</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F3;--panel:#FFFFFF;--ink:#14141A;--muted:#5C5C57;--line:#DAD8D0;--pink:#D4105A;--yellow:#E0A91F;--yshadow:#8F6508;--cyan:#38B6D8;--mint:#BFEBD3;--sun:#F6E3A8;--rose:#F8C6D4;--btn:#14141A;--btn-ink:#FFFFFF;--grid:rgba(20,20,26,.045);--green:#2FB36F;box-sizing:border-box;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#15171D;--panel:#1E212A;--ink:#F4F2EA;--muted:#A9AAA3;--line:#2E323D;--pink:#FF4D8D;--yellow:#F2BE3A;--yshadow:#7A5606;--btn:#F4F2EA;--btn-ink:#15171D;--grid:rgba(255,255,255,.04);color-scheme:dark}}
html{scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Inter",system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;margin:0;line-height:1.1}
h2{font-size:clamp(2rem,5vw,3.5rem)} h3{font-size:1.3rem;font-weight:500} h4{font-size:1rem}
p{margin:0} a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:4px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
.note{font-family:"Caveat",cursive;font-weight:600;font-size:1.5rem;display:inline-block;position:relative;line-height:1}
.note::after{content:"";position:absolute;left:4%;right:4%;bottom:-5px;height:4px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 2px no-repeat;border-radius:50%;transform:rotate(-1deg)}
.mono{font:500 .78rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
/* header */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:2px solid var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px;gap:.8rem;width:min(1180px,100% - 2.5rem);margin:0 auto}
.logo{display:flex;align-items:center;gap:.5rem;font:700 1.05rem "Pixelify Sans",monospace;background:none;border:0;cursor:pointer;color:inherit}
.hud{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap}
.start-btn{display:inline-flex;align-items:center;gap:.4rem;background:var(--pink);color:#fff;font:600 .78rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--ink);border-radius:10px;padding:.5rem .9rem;min-height:40px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.start-btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.start-btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:44px;padding:.6rem 1.2rem;border-radius:10px;background:var(--btn);color:var(--btn-ink);font:600 .82rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sm{min-height:34px;padding:.4rem .8rem;font-size:.72rem;box-shadow:2px 2px 0 var(--ink)}
.btn.sm:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.sm:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.line{background:transparent;color:var(--ink);box-shadow:none}
.btn.line:hover{background:var(--panel);box-shadow:2px 2px 0 var(--ink)}
.btn.line:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.danger{background:#C0392B;color:#fff;border-color:#C0392B}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{background:var(--yellow);color:#14141A;border-color:var(--yshadow)}
.link{font:600 .82rem ui-monospace,Menlo,monospace;text-transform:uppercase;text-decoration:none;background:none;border:0;cursor:pointer;color:inherit;padding:0;letter-spacing:.04em}
.link:hover{text-decoration:underline}
/* layout */
footer{border-top:2px solid var(--ink);padding:1.4rem 0;font:500 .8rem ui-monospace,Menlo,monospace;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:10px;max-width:min(92vw,420px);text-align:center;transition:transform .25s;z-index:99;font:500 .85rem ui-monospace,Menlo,monospace}
#toast.show{transform:translate(-50%,0)}
[hidden]{display:none!important}
.vwrap{width:min(960px,100% - 2.5rem);margin:0 auto;padding:clamp(2rem,6vw,4rem) 0 clamp(2.5rem,7vw,5rem)}
.back{font:600 .8rem ui-monospace,Menlo,monospace;text-transform:uppercase;background:none;border:0;cursor:pointer;color:inherit;padding:0;margin-bottom:1.2rem;display:inline-block}
.back:hover{text-decoration:underline}
/* panel / form */
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:clamp(1rem,3vw,1.8rem)}
.fld{display:grid;gap:.35rem;margin-bottom:1rem}
.fld label{font:600 .75rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:.6rem .8rem;min-height:44px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld small{color:var(--muted);font-size:.78rem}
.fld input[type=checkbox]{width:22px;height:22px;min-height:unset;accent-color:var(--pink);cursor:pointer}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.tabs button{font:600 .78rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.5rem .9rem;border:2px solid var(--ink);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:40px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.msg{min-height:1.2rem;font:500 .82rem ui-monospace,Menlo,monospace;margin-top:.8rem}
.msg.err{color:var(--pink)} .msg.ok{color:var(--green)}
.sep{display:flex;gap:.8rem;align-items:center;margin:1rem 0;color:var(--muted);font:500 .78rem ui-monospace,Menlo,monospace}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--line)}
.notice{border:2px solid var(--pink);border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem;font-weight:500;font-size:.9rem}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:1.4rem;margin-top:1.6rem}
/* workshops grid */
.wgrid{display:grid;gap:1.6rem;margin-top:1.8rem}
.win{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.wbar{display:flex;align-items:center;gap:.6rem;background:var(--yellow);border-bottom:3px solid var(--ink);padding:.45rem .75rem;color:#14141A}
.dots{display:flex;gap:4px}.dots i{width:10px;height:10px;border-radius:50%;background:#14141A;opacity:.85}
.wt{font:600 .72rem ui-monospace,Menlo,monospace;flex:1}
.wbody{padding:1.2rem;display:grid;gap:.45rem;align-content:start;flex:1}
.wbody .lvl{font:700 2.2rem "Pixelify Sans",monospace;color:var(--yellow);text-shadow:3px 3px 0 var(--yshadow);line-height:1}
.wbody p{color:var(--muted);font-size:.9rem}
.win.lock{border-style:dashed;box-shadow:none;opacity:.65}
.win.lock .wbar{background:var(--line);color:var(--muted)}
.win.lock .wbody{justify-items:center;text-align:center;padding:1.8rem 1rem}
@media(min-width:700px){.wgrid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.wgrid{grid-template-columns:repeat(3,1fr)}}
/* session list */
.bar2{height:14px;border:2px solid var(--ink);border-radius:6px;background:var(--bg);overflow:hidden;margin-top:.6rem}
.bar2 i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.rowlist{list-style:none;margin:.6rem 0 0;padding:0}
.rowlist li{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;padding:.8rem 0;border-top:2px solid var(--line)}
.rowlist input[type=checkbox]{width:26px;height:26px;accent-color:var(--pink);cursor:pointer}
.rowlist label{cursor:pointer}
.rowlist b{font-weight:600}
/* hero */
.hero{text-align:center;padding:clamp(2.5rem,7vw,5rem) 0 0}
.frame{display:inline-block;padding:.8rem 1.6rem;margin-top:.6rem;background:linear-gradient(var(--cyan),var(--cyan)) 0 0/20px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 0/3px 20px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 0/20px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 0/3px 20px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 100%/20px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 100%/3px 20px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/20px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/3px 20px no-repeat}
h1{font-size:clamp(3rem,12vw,9rem);letter-spacing:.01em;text-shadow:4px 4px 0 var(--line)}
h1 span{color:var(--yellow);text-shadow:4px 4px 0 var(--yshadow)}
.tag{font:500 .78rem ui-monospace,Menlo,monospace;color:var(--muted);margin-top:1rem;display:block}
.tagline{font-size:clamp(1.1rem,2.5vw,1.5rem);font-weight:500;margin-top:1.2rem}
.cta{display:flex;gap:1rem;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:1.4rem}
.stks{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.stk{display:inline-flex;align-items:center;gap:.4rem;font:600 .7rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.4rem .7rem;border-radius:6px;color:#14141A;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.s1{background:var(--sun)}.s2{background:var(--rose)}.s3{background:var(--mint)}
.ground{position:relative;margin-top:2rem;height:110px}
.ground svg{position:absolute;inset:auto 0 0;width:100%;height:100%}
.big{font-size:clamp(1.3rem,3vw,2rem);font-weight:500;line-height:1.4}
mark{border-radius:4px;padding:0 .2em;color:inherit}
.m1{background:var(--sun)}.m2{background:var(--mint)}.m3{background:var(--rose)}
/* ── WORKSHOP WINDOWS & SKILL TREE ── */
.win-row{display:grid;grid-template-columns:1fr;gap:1.4rem;margin-top:1.6rem}
@media(min-width:768px){.win-row{grid-template-columns:1fr 1fr}}
.pulse-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#E74C3C;box-shadow:0 0 0 rgba(231,76,60,.7);animation:pulseDot 1.5s infinite;vertical-align:middle;margin-right:6px}
@keyframes pulseDot{0%{box-shadow:0 0 0 0 rgba(231,76,60,.7)}70%{box-shadow:0 0 0 8px rgba(231,76,60,0)}100%{box-shadow:0 0 0 0 rgba(231,76,60,0)}}

/* Tree / Graph Structure */
.tree-container{margin-top:2rem;position:relative}
.tree-track{display:grid;gap:1.2rem;position:relative;padding-left:1.6rem;border-left:3px dashed var(--ink);margin-left:.75rem}
.tree-node{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:1rem 1.2rem;position:relative;cursor:pointer;transition:transform .12s,box-shadow .12s;display:grid;gap:.5rem}
.tree-node:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.tree-node::before{content:"";position:absolute;left:-1.65rem;top:1.4rem;width:1.2rem;height:3px;background:var(--ink)}
.tree-node::after{content:"";position:absolute;left:-2.05rem;top:1.15rem;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--panel)}
.tree-node.done{border-color:var(--green)}
.tree-node.done::after{background:var(--green)}
.tree-node.active{border-color:var(--pink);box-shadow:5px 5px 0 var(--pink)}
.tree-node.active::after{background:var(--pink)}
.tree-node-top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.3rem;font:600 .68rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.2rem .55rem;border-radius:6px;border:1.5px solid var(--ink);letter-spacing:.03em}
.chip.done{background:var(--mint);color:#14141A}
.chip.active{background:var(--sun);color:#14141A}
.chip.locked{background:var(--bg);color:var(--muted)}

/* Session Detail Window */
.session-win{margin-top:2rem}
.session-win-tabs{display:flex;gap:.4rem;background:var(--bg);border-bottom:3px solid var(--ink);padding:.5rem .7rem;overflow-x:auto}
.session-win-tabs button{font:600 .75rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.45rem .85rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap}
.session-win-tabs button.on{background:var(--ink);color:var(--bg)}
.notes-pad{width:100%;min-height:160px;font:500 .88rem ui-monospace,Menlo,Consolas,monospace;line-height:1.6;background:var(--bg);color:var(--ink);border:2px solid var(--ink);border-radius:8px;padding:.8rem;resize:vertical}
.doubt-item{background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:.85rem;margin-top:.8rem;display:grid;gap:.35rem}
.subtopics-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.3rem}
.subtopics-tags span{font:500 .72rem ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.15rem .45rem;color:var(--muted)}
/* ── WORKSHOP SUB-NAV BAR & SUBPAGES ── */
.workshop-nav{display:flex;gap:.5rem;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:.5rem;box-shadow:4px 4px 0 var(--ink);margin:1.4rem 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
.workshop-nav-btn{display:inline-flex;align-items:center;gap:.45rem;font:600 .78rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.03em;padding:.55rem .95rem;border:2px solid transparent;border-radius:8px;background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:all .12s}
.workshop-nav-btn:hover{background:var(--bg);border-color:var(--ink)}
.workshop-nav-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.session-pills{display:flex;gap:.45rem;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:.4rem;margin:1rem 0}
.session-pill{font:600 .75rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.45rem .85rem;border:2px solid var(--ink);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .12s}
.session-pill:hover{transform:translateY(-1px)}
.session-pill.on{background:var(--pink);color:#fff;border-color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.session-pill.done{border-color:var(--green)}
</style>
</head>
<body>
<header>
  <div class="bar">
    <button class="logo" onclick="go('')">start.here</button>
    <div class="hud" id="hud"></div>
  </div>
</header>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<footer><div class="wrap"><span>&copy; start.here &middot; a student-led learning community</span></div></footer>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

var C = window.APP_CONFIG || {};
var sb = (window.supabase && C.SUPABASE_URL && C.SUPABASE_KEY)
  ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY)
  : null;

var S = {
  user: null,
  profile: null,
  needPw: false,
  open: {}
};

var $ = function(id){ return document.getElementById(id); };
var app = $("app");
var toastEl = $("toast"), tt;

function say(m, dur){
  toastEl.textContent = m;
  toastEl.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(function(){ toastEl.classList.remove("show"); }, dur || 3200);
}

function go(name){
  var target = name ? "#" + name : "";
  if ((location.hash || "") === target) route();
  else location.hash = name;
}
window.go = go;

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function fmt(t){ return t ? new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}) : "Date to be announced"; }
function isAdmin(){ return !!(S.profile && S.profile.role === "admin"); }

function h(tag, props){
  var e = document.createElement(tag), k, kids = Array.prototype.slice.call(arguments, 2);
  props = props || {};
  for(k in props){
    var v = props[k];
    if(k === "class") e.className = v;
    else if(k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if(v === true) e.setAttribute(k, "");
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  (function add(list){
    list.forEach(function(c){
      if(Array.isArray(c)) return add(c);
      if(c == null || c === false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  })(kids);
  return e;
}

function msgBox(){ return h("p", {class:"msg", role:"status", "aria-live":"polite"}); }
function setMsg(el, t, bad){ el.textContent = t || ""; el.className = "msg" + (bad ? " err" : bad === false ? " ok" : ""); }

function fld(id, label, attrs, hint){
  return h("div", {class:"fld"},
    h("label", {for:id}, label),
    h("input", Object.assign({id:id}, attrs)),
    hint ? h("small", null, hint) : null
  );
}

function showModal(content, onClose){
  var root = $("modal-root");
  var bg = h("div", {class:"modal-bg", onclick:function(e){ if(e.target === bg){ root.replaceChildren(); if(onClose) onClose(); } }},
    h("div", {class:"modal"}, content));
  root.replaceChildren(bg);
}
function closeModal(){ $("modal-root").replaceChildren(); }

/* ── SUPABASE AUTH & STATE REFRESH ── */
async function refreshAuth(){
  if (!sb) return;
  try {
    var sessionRes = await sb.auth.getSession();
    var session = sessionRes.data && sessionRes.data.session;
    S.user = session ? session.user : null;
    S.profile = null;
    if (S.user) {
      var pRes = await sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle();
      S.profile = pRes.data || null;
    }
  } catch (err) {
    console.warn("Auth check error:", err);
    S.user = null;
    S.profile = null;
  }
}

async function signOut(){
  if (sb) {
    try { await sb.auth.signOut(); } catch(e){}
  }
  S.user = null;
  S.profile = null;
  S.needPw = false;
  hud();
  go("");
  say("Signed out.");
}

/* ══════════════════════════════
   HUD
══════════════════════════════ */
function hud(){
  var box = $("hud");
  box.replaceChildren();
  if(!S.user){
    box.appendChild(h("button", {class:"start-btn", onclick:function(){ go("auth"); }}, "Sign in ▶"));
    return;
  }
  var name = (S.profile && S.profile.full_name) || S.user.email;
  var navItems = [
    h("span", {class:"mono"}, name),
    h("button", {class:"link", onclick:function(){ go("workshops"); }}, "Workshops"),
    h("button", {class:"link", onclick:function(){ go("account"); }}, "Account"),
    isAdmin() ? h("a", {class:"link", href:"admin.html", style:"color:var(--pink);font-weight:700"}, "Admin ↗") : null,
    h("button", {class:"link", onclick:signOut}, "Sign out")
  ].filter(Boolean);

  navItems.forEach(function(el){ box.appendChild(el); });
}

/* ══════════════════════════════
   WELCOME VIEW
══════════════════════════════ */
function welcome(){
  app.replaceChildren(
    h("section", {class:"wrap hero"},
      h("span", {class:"note"}, "new game:"), h("br"),
      h("div", {class:"frame"}, h("h1", null, "START ", h("span", null, "HERE"))),
      h("span", {class:"tag"}, "FREE WORKSHOP · FOR STUDENTS · ONLINE"),
      h("p", {class:"tagline"}, "Learn tech from zero, one level at a time."),
      h("div", {class:"cta"},
        h("button", {class:"btn", onclick:function(){ go(S.user ? "workshops" : "auth"); }}, S.user ? "Go to Workshops ▶" : "Save my seat ▶"),
        h("button", {class:"link", onclick:function(){ var el = document.getElementById("about"); if(el) el.scrollIntoView({behavior:"smooth"}); }}, "Learn more →")
      ),
      h("div", {class:"stks"},
        h("span", {class:"stk s1"}, "★ Free workshop"),
        h("span", {class:"stk s2"}, "♥ Live + recorded"),
        h("span", {class:"stk s3"}, "● 7 levels")
      ),
      h("div", {class:"ground"},
        h("svg", {viewBox:"0 0 1200 130", preserveAspectRatio:"none"},

function authView(mode){
  mode = mode || "in";

    return h("button", {type:"button", class:mode === m ? "on" : "", onclick:function(){ authView(m); }}, t);
  }
  var box = h("div", {class:"vwrap"},
    h("button", {class:"back", onclick:function(){ go(""); }}, "← Back"), h("br"),
    h("span", {class:"note"}, "player login"),
    h("h2", {style:"margin:1rem 0 1.4rem"}, mode === "up" ? "Create your player" : mode === "code" ? "Forgot password" : "Welcome back"),
    h("div", {class:"tabs"}, tab("in", "Sign in"), tab("up", "Create account"), tab("code", "Forgot password"))
  );

  var msg = msgBox(), f;

  if (mode === "in") {
    f = h("form", {class:"panel"},
      fld("in-e", "Email", {type:"email", required:true, autocomplete:"email", placeholder:"you@example.com"}),
      fld("in-p", "Password", {type:"password", required:true, autocomplete:"current-password"}),
      h("button", {class:"btn", type:"submit"}, "Sign in ▶"), msg
    );
    f.addEventListener("submit", async function(ev){
      ev.preventDefault();
      setMsg(msg, "Signing in...");
      var email = $("in-e").value.trim();
      var password = $("in-p").value;
      if (!sb) return setMsg(msg, "Database connection not ready. Check config.js.", true);

      var res = await sb.auth.signInWithPassword({ email: email, password: password });
      if (res.error) {
        return setMsg(msg, res.error.message, true);
      }
      await refreshAuth();
      hud();
      go("workshops");
      say("Welcome back!");
    });

  } else if (mode === "up") {
    var yr = h("select", {id:"up-y", required:true},
      h("option", {value:""}, "Choose one"),
      ["1st year", "2nd year", "3rd year", "4th year", "Other"].map(function(y){ return h("option", {value:y}, y); })
    );
    f = h("form", {class:"panel"},
      fld("up-n", "Your name", {required:true, autocomplete:"name"}),
      fld("up-e", "Email", {type:"email", required:true, autocomplete:"email"}),
      fld("up-w", "WhatsApp number", {type:"tel"}, "Optional. For session reminders."),

      fld("up-p", "Password", {type:"password", required:true, minlength:"8"}, "At least 8 characters."),
      h("button", {class:"btn", type:"submit"}, "Start game ▶"), msg
    );
    f.addEventListener("submit", async function(ev){
      ev.preventDefault();
      setMsg(msg, "Creating your account...");
      var sName = $("up-n").value.trim() || "New Player";
      var sEmail = $("up-e").value.trim();
      var sPhone = $("up-w").value.trim();
      var sYear = $("up-y").value;
      var sQuestion = $("up-q").value.trim();
      var sPassword = $("up-p").value;

      if (!sb) return setMsg(msg, "Database connection not ready. Check config.js.", true);

      var res = await sb.auth.signUp({
        email: sEmail,
        password: sPassword,
        options: {
          data: {
            full_name: sName,
            phone: sPhone,
            year: sYear,
            why: sQuestion
          }
        }
      });

      if (res.error) {
        return setMsg(msg, res.error.message, true);
      }

      // If user session is created immediately:
      await refreshAuth();
      if (!S.user) {
        // Fallback: sign in with password to obtain active session
        var signRes = await sb.auth.signInWithPassword({ email: sEmail, password: sPassword });
        if (!signRes.error) await refreshAuth();
      }

      hud();
      go("workshops");
      say("Account created! Welcome, " + sName + ".");
    });

  } else {

      fld("fc-e", "Email", {type:"email", required:true, autocomplete:"email"}),
      h("button", {class:"btn", type:"submit"}, "Send reset link ▶"), msg
    );
    f.addEventListener("submit", async function(ev){
      ev.preventDefault();
      var email = $("fc-e").value.trim();
      setMsg(msg, "Sending reset link...");
      if (!sb) return setMsg(msg, "Database connection not ready.", true);
      var res = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin
      });
      if (res.error) {
        return setMsg(msg, res.error.message, true);
      }
      setMsg(msg, "Reset link sent! Please check your email inbox.", false);
    });

  box.append(f);

      class: "btn line",
      type: "button",
      style: "width:100%;margin-top:1rem;display:flex;align-items:center;justify-content:center;gap:.6rem;background:var(--panel)",
      onclick: async function(){
        if (!sb) return say("Database not connected.");
        say("Connecting to Google...");
        try {
          var r = await sb.auth.signInWithOAuth({
            provider: "google",
            options: {
              redirectTo: window.location.origin
            }
          });
          if (r.error) {
            say("Google Sign-in: " + r.error.message, 4500);
          }
        } catch(e) {
          say("Google Sign-in: " + e.message, 4500);
        }
      }
    },
      h("svg", {viewBox:"0 0 24 24", width:"18", height:"18"},
        h("path", {fill:"#4285F4", d:"M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"}),
        h("path", {fill:"#34A853", d:"M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"}),
        h("path", {fill:"#FBBC05", d:"M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"}),
        h("path", {fill:"#EA4335", d:"M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"})
      ),
      "Continue with Google"
    );
    box.append(

async function workshopsView(){
  if (!S.user) return go("auth");
  if (!sb) {
    app.replaceChildren(h("div", {class:"vwrap"}, h("h2", null, "Configuration error"), h("p", null, "Missing Supabase configuration in config.js.")));
    return;
  }

  app.replaceChildren(h("div", {class:"vwrap"},
    h("span", {class:"note"}, "loading levels..."),
    h("h2", {style:"margin:1rem 0"}, "Connecting to database...")
  ));

  try {
    var uid = S.user.id;
    var res = await Promise.all([
      sb.from("workshops").select("*").eq("published", true).order("level_no"),
      sb.from("enrollments").select("workshop_id").eq("user_id", uid),
      sb.from("sessions").select("id,workshop_id"),
      sb.from("session_progress").select("session_id").eq("user_id", uid)
    ]);

    for (var i = 0; i < res.length; i++) {
      if (res[i].error) throw res[i].error;
    }

    var workshops = res[0].data || [];
    var enrolledMap = {};
    (res[1].data || []).forEach(function(e){ enrolledMap[e.workshop_id] = true; });

    var doneSet = {};
    (res[3].data || []).forEach(function(p){ doneSet[p.session_id] = true; });

    var totalSessions = {}, doneSessions = {};
    (res[2].data || []).forEach(function(s){
      totalSessions[s.workshop_id] = (totalSessions[s.workshop_id] || 0) + 1;
      if (doneSet[s.id]) {
        doneSessions[s.workshop_id] = (doneSessions[s.workshop_id] || 0) + 1;
      }
    });

    var isWorkshopDone = function(w){
      var t = totalSessions[w.id] || 0;
      return t > 0 && (doneSessions[w.id] || 0) === t;
    };

    var grid = h("div", {class:"wgrid"});

    workshops.forEach(function(w, idx){
      var unlocked = (idx === 0) || isWorkshopDone(workshops[idx - 1]);
      if (!unlocked) {
        grid.append(winCard("locked.exe", true, [
          h("p", {style:"font-size:2rem;margin-bottom:.4rem"}, "🔒"),
          h("h3", null, "Level " + pad2(w.level_no)),
          h("p", null, "Unlocks soon")
        ]));
        return;
      }

      var tot = totalSessions[w.id] || 0;
      var comp = doneSessions[w.id] || 0;
      var pct = tot ? Math.round(comp / tot * 100) : 0;
      var isEnrolled = !!enrolledMap[w.id];

      grid.append(winCard("level_" + pad2(w.level_no) + ".exe", false, [
        h("span", {class:"lvl"}, pad2(w.level_no)),
        h("h3", null, w.title),
        w.description ? h("p", null, w.description) : null,
        h("div", {class:"bar2"}, h("i", {style:"width:" + pct + "%"})),
        h("span", {class:"mono"}, isEnrolled ? comp + " / " + tot + " sessions" : "Not started"),
        h("button", {class:"btn", style:"margin-top:.6rem", onclick:async function(){
          if (!isEnrolled) {
            try {
              await sb.from("enrollments").upsert({
                user_id: uid,
                workshop_id: w.id
              }, { onConflict: "user_id,workshop_id", ignoreDuplicates: true });
            } catch(e){
              console.warn("Enrollment notice:", e);
            }
          }
          go("workshop-" + w.id);
        }}, (isEnrolled ? "Continue" : "Enter") + " ▶")
      ]));
    });

    app.replaceChildren(h("div", {class:"vwrap"},
      h("span", {class:"note"}, "welcome, " + ((S.profile && S.profile.full_name) || "player")),
      h("h2", {style:"margin:1rem 0 .5rem"}, "Choose your level"),
      h("p", {class:"mono"}, "Finish a level to unlock the next one."),
      workshops.length ? grid : h("p", {style:"margin-top:2rem;color:var(--muted)"}, "No workshops are published yet. Check back soon.")
    ));

  } catch(err) {
    app.replaceChildren(h("div", {class:"vwrap"},
      h("h2", null, "Could not load workshops"),
      h("p", {style:"margin-top:1rem;color:var(--pink)"}, err.message || String(err)),
      h("button", {class:"btn sm", style:"margin-top:1rem", onclick:workshopsView}, "Retry ▶")
    ));
  }
}

function compPanel(c, mine){
  var closed = c.status === "closed" || (c.closes_at && new Date(c.closes_at) < new Date());
  var open = c.status === "open" && !closed;
  var p = h("section", {class:"panel"},
    h("h3", null, c.title),
    c.description ? h("p", {style:"color:var(--muted);margin:.4rem 0 1rem"}, c.description) : null
  );

  if (c.status === "locked") {
    p.append(h("p", {class:"mono"}, "🔒 Locked. Opens when the organiser starts it."));
    return p;
  }
  if (!open) {
    p.append(h("p", {class:"mono"}, mine ? "Closed. Your submission was received." : "This competition is closed."));
    return p;
  }

  var ans = (mine && mine.answers) || {}, form = h("form"), msg = msgBox();
  (c.fields || []).forEach(function(f){
    var id = "cf-" + c.id + "-" + f.key;
    var short = ["url", "email", "number", "short"].indexOf(f.type) >= 0;
    var el = short ? h("input", {id:id, type:f.type === "short" ? "text" : f.type, required:!!f.required}) : h("textarea", {id:id, required:!!f.required});
    el.value = ans[f.key] || "";
    el.dataset.key = f.key;
    form.append(h("div", {class:"fld"}, h("label", {for:id}, f.label), el));
  });

  form.append(h("button", {class:"btn", type:"submit"}, (mine ? "Update" : "Submit") + " ▶"), msg);
  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var a = {};
    form.querySelectorAll("[data-key]").forEach(function(el){ a[el.dataset.key] = el.value.trim(); });
    setMsg(msg, "Saving submission...");
    var res = await sb.from("submissions").upsert({
      competition_id: c.id,
      user_id: S.user.id,
      answers: a,
      updated_at: new Date().toISOString()
    }, { onConflict: "competition_id,user_id" });

    if (res.error) {
      setMsg(msg, res.error.message, true);
    } else {
      setMsg(msg, "Submitted ✓ — editable until competition closes.", false);
    }
  });

  p.append(form);
  return p;
}

var _workshopCache = null;

async function workshopView(wid, subview, sessionParam){
  if (!S.user) return go("auth");

  subview = subview || "tree";
  var uid = S.user.id;

  var cached = (_workshopCache && _workshopCache.wid === wid && _workshopCache.uid === uid) ? _workshopCache : null;

  if (!cached) {
    app.replaceChildren(h("div", {class:"vwrap"},
      h("span", {class:"note"}, "loading level..."),
      h("h2", {style:"margin:1rem 0"}, "Loading syllabus...")
    ));
  }

  try {
    if (!cached) {
      try {
        await sb.from("enrollments").upsert({
          user_id: uid,
          workshop_id: wid
        }, { onConflict: "user_id,workshop_id", ignoreDuplicates: true });
      } catch(e){
        console.warn("Enrollment ensure notice:", e);
      }

      var res = await Promise.all([
        sb.from("workshops").select("*").eq("id", wid).maybeSingle(),
        sb.from("workshop_links").select("live_url").eq("workshop_id", wid).maybeSingle(),
        sb.from("sessions").select("*").eq("workshop_id", wid).order("position"),
        sb.from("session_progress").select("session_id").eq("user_id", uid),
        sb.from("competitions").select("*").eq("workshop_id", wid).order("created_at")
      ]);

      for (var i = 0; i < res.length; i++) {
        if (res[i].error) throw res[i].error;
      }

      var w = res[0].data;
      if (!w) {
        app.replaceChildren(h("div", {class:"vwrap"}, h("h2", null, "Workshop not found"), h("button", {class:"btn sm", onclick:function(){ go("workshops"); }}, "← Back to levels")));
        return;
      }

      var live = res[1].data ? res[1].data.live_url : "";
      var sessions = res[2].data || [];
      var doneMap = {};
      (res[3].data || []).forEach(function(p){ doneMap[p.session_id] = true; });

      var comps = res[4].data || [];
      var submissionsMap = {};
      if (comps.length > 0) {
        var subRes = await sb.from("submissions").select("*").eq("user_id", uid).in("competition_id", comps.map(function(c){ return c.id; }));
        (subRes.data || []).forEach(function(s){ submissionsMap[s.competition_id] = s; });
      }

      var doubts = [];
      try {
        var dRes = await sb.from("doubts").select("*").eq("workshop_id", wid).order("created_at", { ascending: false });
        if (!dRes.error && dRes.data) {
          doubts = dRes.data;
        } else {
          doubts = JSON.parse(localStorage.getItem("start_here_doubts_" + wid) || "[]");
        }
      } catch(e){
        try { doubts = JSON.parse(localStorage.getItem("start_here_doubts_" + wid) || "[]"); } catch(err2){ doubts = []; }
      }

      cached = {
        wid: wid,
        uid: uid,
        w: w,
        live: live,
        sessions: sessions,
        doneMap: doneMap,
        comps: comps,
        submissionsMap: submissionsMap,
        doubts: doubts
      };
      _workshopCache = cached;
    }

    var w = cached.w;
    var live = cached.live;
    var sessions = cached.sessions;
    var doneMap = cached.doneMap;
    var comps = cached.comps;
    var submissionsMap = cached.submissionsMap;
    var doubts = cached.doubts;

    async function refreshDoubts(){
      try {
        var dRes = await sb.from("doubts").select("*").eq("workshop_id", wid).order("created_at", { ascending: false });
        if (!dRes.error && dRes.data) {
          cached.doubts = dRes.data;
          doubts = cached.doubts;
          return;
        }
      } catch(e){}
      try {
        cached.doubts = JSON.parse(localStorage.getItem("start_here_doubts_" + wid) || "[]");
        doubts = cached.doubts;
      } catch(e){ cached.doubts = []; doubts = []; }
    }

    // Determine active session index
    var activeSessionIdx = 0;
    if (typeof sessionParam === "number" && sessionParam >= 1 && sessionParam <= sessions.length) {
      activeSessionIdx = sessionParam - 1;
    } else {
      for (var sIdx = 0; sIdx < sessions.length; sIdx++) {
        if (!doneMap[sessions[sIdx].id]) {
          activeSessionIdx = sIdx;
          break;
        }
      }
    }

    var container = h("div", {class:"vwrap"});
    var progressPct = h("span", {class:"mono"});
    var progressBar = h("i", {style:"width:0"});

    function updateProgress(){
      var compCount = sessions.filter(function(s){ return doneMap[s.id]; }).length;
      var total = sessions.length;
      progressBar.style.width = (total ? Math.round(compCount / total * 100) : 0) + "%";
      progressPct.textContent = (total && compCount === total) ? "ALL SESSIONS COMPLETED 🎉" : compCount + " / " + total + " sessions finished";
    }

    async function toggleSessionProgress(s){
      var isDone = !doneMap[s.id];
      if (isDone) {
        doneMap[s.id] = true;
        updateProgress();
        renderWorkspace();
        var addRes = await sb.from("session_progress").insert({ user_id: uid, session_id: s.id });
        if (addRes.error && addRes.error.code !== "23505") {
          delete doneMap[s.id];
          updateProgress();
          renderWorkspace();
          say("Could not save progress. Please try again.");
        } else {
          say("Session " + pad2(s.position) + " marked complete! ✓");
        }
      } else {
        delete doneMap[s.id];
        updateProgress();
        renderWorkspace();
        var delRes = await sb.from("session_progress").delete().eq("user_id", uid).eq("session_id", s.id);
        if (delRes.error) {
          doneMap[s.id] = true;
          updateProgress();
          renderWorkspace();
          say("Could not update progress.");
        }
      }
    }

    function renderSessionPills(targetSubview){
      var pills = sessions.map(function(s, idx){
        var isDone = !!doneMap[s.id];
        var isCurrent = (idx === activeSessionIdx);
        var pillClass = "session-pill" + (isCurrent ? " on" : "") + (isDone ? " done" : "");
        var sNum = pad2(idx + 1);
        var label = (isDone ? "✓ " : "") + "Session " + sNum + (isCurrent ? " ▶" : "");
        return h("button", {
          type:"button",
          class: pillClass,
          onclick: function(){
            location.hash = "workshop-" + wid + "/" + targetSubview + "/" + (idx + 1);
          }
        }, label);
      });
      return h("div", {class:"session-pills"}, pills);
    }

    function renderWorkspace(){
      container.replaceChildren();

      // Top Breadcrumb & Level Header
      var headerEl = h("div", null,
        h("button", {class:"back", onclick:function(){ go("workshops"); }}, "← All levels"), h("br"),
        h("span", {class:"note"}, "level " + pad2(w.level_no) + " · quest map"),
        h("h2", {style:"margin:.6rem 0 .3rem"}, w.title),
        w.description ? h("p", {style:"color:var(--muted);margin-bottom:1rem"}, w.description) : null,
        h("div", {class:"bar2"}, progressBar),
        progressPct
      );

      // Top Task Navigation Bar
      var sNum = activeSessionIdx + 1;
      var sessionDoubts = doubts.filter(function(d){ return d.session_id === (sessions[activeSessionIdx] && sessions[activeSessionIdx].id); });
      var navItems = [
        { id:"tree", label:"🗺️ Roadmap", hash:"#workshop-" + wid + "/tree" },
        { id:"session", label:"💻 Session " + pad2(sNum), hash:"#workshop-" + wid + "/session/" + sNum },
        { id:"notes", label:"📝 Study Notes", hash:"#workshop-" + wid + "/notes/" + sNum },

      ];

      var navBar = h("div", {class:"workshop-nav"},

      var curr = sessions[activeSessionIdx] || null;

      // ──────────────────────────────────────────
      // VIEW 1: ROADMAP / SKILL TREE
      // ──────────────────────────────────────────
      if (subview === "tree") {
        var scheduleWindow = winCard("schedule.exe · Workshop Roadmap", false, [
          h("div", {style:"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.8rem"},

            ),
            h("span", {class:"chip"}, sessions.length + " interactive sessions")
          )
        ]);

        var liveNotice = null;
        if (live) {
          liveNotice = h("div", {class:"notice", style:"margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.6rem"},
            h("div", {style:"display:flex;align-items:center;gap:.6rem"},
              h("span", {class:"pulse-dot"}),

            h("a", {class:"btn sm success", href:"#workshop-" + wid + "/live"}, "Enter Broadcast Room ▶")
          );
        }

        var treeNodes = sessions.map(function(s, idx){
          var isDone = !!doneMap[s.id];
          var isCurrent = (idx === activeSessionIdx);
          var nodeClass = "tree-node" + (isDone ? " done" : isCurrent ? " active" : "");

          return h("div", {class:nodeClass},

            h("b", {style:"font-size:1.1rem;display:block;margin:.2rem 0"}, (idx + 1) + ". " + s.title),

                }, "📝 Notes"),

                  class:"btn sm line",
                  onclick:function(e){ e.stopPropagation(); location.hash = "workshop-" + wid + "/doubts/" + (idx + 1); }

                  class:"btn sm " + (isCurrent ? "success" : ""),
                  onclick:function(e){ e.stopPropagation(); location.hash = "workshop-" + wid + "/session/" + (idx + 1); }
                }, "Open Workspace →")
              )

          );
        });

        var treeWindow = winCard("skill_tree.exe · Level Progression Map", false, [
          h("p", {class:"mono", style:"margin-bottom:1.2rem"}, "Progression tree — Click 'Open Workspace' on any node to enter its dedicated workspace:"),

      // ──────────────────────────────────────────
      else if (subview === "session") {

        } else {

            h("div", null,
              h("span", {class:"mono"}, "SESSION " + pad2(sNum) + " NOTES"),
              h("h3", {style:"margin:.3rem 0 .4rem"}, curr.title + " · Study Notes"),

          );

          var notesWin = h("div", {class:"win session-win", style:"margin-top:0"},
            h("div", {class:"wbar"},
              h("span", {class:"dots"}, h("i"), h("i"), h("i")),
              h("span", {class:"wt"}, "study_notes_session_" + pad2(sNum) + ".exe"),
              h("span", {class:"mono", style:"color:#14141A;font-weight:700"}, "LV " + pad2(w.level_no))

          subpageContent = h("div", null, renderSessionPills("notes"), notesWin);

      // ──────────────────────────────────────────
      else if (subview === "doubts") {
        if (!curr) {
          subpageContent = h("div", {class:"panel"}, h("p", null, "No session selected."));
        } else {
          var currDoubts = doubts.filter(function(d){ return d.session_id === curr.id; });

          var doubtDInput = h("textarea", {style:"min-height:70px;resize:vertical", placeholder:"Provide more context, paste the error message or terminal command..."});
          var doubtImgInput = h("input", {type:"url", placeholder:"Optional image/screenshot URL (e.g. Imgur, Cloudinary, Drive link)"});
          var doubtMsg = msgBox();

          var doubtForm = h("form", {class:"panel", style:"padding:1.1rem;background:var(--bg)"},
            h("h4", null, "Upload / Ask a Doubt for Session " + pad2(sNum)),
            h("div", {class:"fld", style:"margin-top:.6rem"}, h("label", null, "Your Question *"), doubtQInput),
            h("div", {class:"fld"}, h("label", null, "Error Details / Terminal Context"), doubtDInput),
            h("div", {class:"fld"}, h("label", null, "Screenshot URL (Optional)"), doubtImgInput),
            h("button", {class:"btn sm", type:"submit"}, "Submit Doubt ▶"),
            doubtMsg
          );

          doubtForm.addEventListener("submit", async function(ev){
            ev.preventDefault();
            var q = doubtQInput.value.trim();
            var d = doubtDInput.value.trim();
            var img = doubtImgInput.value.trim();
            if (!q) return;

            setMsg(doubtMsg, "Submitting doubt...");
            var newDoubt = {
              workshop_id: wid,
              session_id: curr.id,
              user_id: uid,
              student_name: (S.profile && S.profile.full_name) || S.user.email,
              question: q,
              details: d,
              screenshot_url: img,
              status: "open",
              created_at: new Date().toISOString()
            };

            var dbSuccess = false;
            try {
              var insRes = await sb.from("doubts").insert(newDoubt);
              if (!insRes.error) dbSuccess = true;
            } catch(e){}

            var localDoubts = [];
            try {
              localDoubts = JSON.parse(localStorage.getItem("start_here_doubts_" + wid) || "[]");
            } catch(e){ localDoubts = []; }
            localDoubts.unshift(newDoubt);
            try {
              localStorage.setItem("start_here_doubts_" + wid, JSON.stringify(localDoubts));
            } catch(e){}

            try { await refreshDoubts(); } catch(e){}
            setMsg(doubtMsg, "Doubt submitted successfully! Mentors will review it.", false);

                      h("b", {style:"color:var(--green)"}, "Mentor Reply: "), dbItem.answer
                    ) : null,
                    h("span", {class:"mono", style:"font-size:.7rem"}, (dbItem.student_name || "Student") + " · " + fmt(dbItem.created_at))
                  );
                })
              : h("p", {style:"color:var(--muted);font-size:.85rem;margin-top:.5rem"}, "No doubts submitted yet for this session. Be the first to ask!")
          );

          var doubtsBody = h("div", {style:"padding:1.4rem;display:grid;gap:1.2rem"},
            h("div", null,
              h("span", {class:"mono"}, "SESSION " + pad2(sNum) + " Q&A"),

          h("div", {style:"display:flex;align-items:center;gap:.7rem"},

            h("h3", null, live ? "LIVE BROADCAST ACTIVE" : "BROADCAST STANDBY")

            h("h4", {style:"margin-bottom:.4rem"}, "Live Class Guidelines"),
            h("ul", {style:"margin:0;padding-left:1.2rem;line-height:1.7;font-size:.9rem"},
              h("li", null, "Please keep your microphone muted when entering the session."),
              h("li", null, "Use the '❓ Doubts' tab to submit questions or code issues in real-time."),
              h("li", null, "All sessions are recorded and will appear in the Session Workspace afterward.")

        var liveWin = winCard("broadcast_room.exe · Live Stream", false, [liveBody]);
        subpageContent = h("div", null, liveWin);

      // VIEW 6: CHALLENGES & COMPETITIONS
      // ──────────────────────────────────────────
      else if (subview === "challenge") {

          return compPanel(c, submissionsMap[c.id]);

        subpageContent = h("div", {class:"stack"},
          h("div", null,

    app.replaceChildren(h("div", {class:"vwrap"},

}

/* ══════════════════════════════
   ACCOUNT VIEW
══════════════════════════════ */
function accountView(){
  if (!S.user) return go("auth");

  var p = S.profile || {};
  var msg1 = msgBox(), msg2 = msgBox();

  var f1 = h("form", {class:"panel"},
    h("h3", {style:"margin-bottom:1rem"}, "Your details"),
    fld("ac-n", "Name", {required:true, value:p.full_name || ""}),
    fld("ac-w", "WhatsApp number", {type:"tel", value:p.phone || ""}),
    h("p", {class:"mono", style:"margin-bottom:1rem"}, "Email: " + S.user.email),
    h("button", {class:"btn", type:"submit"}, "Save details"), msg1
  );

  f1.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var newName = $("ac-n").value.trim();
    var newPhone = $("ac-w").value.trim();
    setMsg(msg1, "Saving...");
    var res = await sb.from("profiles").update({ full_name: newName, phone: newPhone }).eq("id", S.user.id);
    if (res.error) {
      setMsg(msg1, res.error.message, true);
    } else {
      if (!S.profile) S.profile = {};
      S.profile.full_name = newName;
      S.profile.phone = newPhone;
      hud();
      setMsg(msg1, "Saved ✓", false);
    }
  });

  var f2 = h("form", {class:"panel"},
    h("h3", {style:"margin-bottom:1rem"}, "Change password"),
    fld("ac-p", "New password", {type:"password", required:true, minlength:"8"}),
    fld("ac-p2", "Repeat new password", {type:"password", required:true, minlength:"8"}),
    h("button", {class:"btn", type:"submit"}, "Update password"), msg2
  );

  f2.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var p1 = $("ac-p").value, p2 = $("ac-p2").value;
    if (p1 !== p2) return setMsg(msg2, "Passwords do not match.", true);
    setMsg(msg2, "Updating password...");
    var res = await sb.auth.updateUser({ password: p1 });
    if (res.error) {
      setMsg(msg2, res.error.message, true);
    } else {
      S.needPw = false;
      $("ac-p").value = "";
      $("ac-p2").value = "";
      setMsg(msg2, "Password updated ✓", false);
    }
  });

  app.replaceChildren(h("div", {class:"vwrap"},
    h("button", {class:"back", onclick:function(){ go("workshops"); }}, "← Workshops"), h("br"),
    h("span", {class:"note"}, "your player"),
    h("h2", {style:"margin:1rem 0 1.4rem"}, "Account"),
    S.needPw ? h("div", {class:"notice"}, "You're signed in with a temporary link. Set your permanent password below.") : null,
    h("div", {class:"stack"}, f1, f2,
      h("div", null, h("button", {class:"btn line", type:"button", onclick:signOut}, "Sign out"))
    )
  ));
}

/* ══════════════════════════════
   ROUTER & INIT
══════════════════════════════ */
var ROUTES = {
  "": welcome,
  "auth": function(){ authView("in"); },
  "workshops": function(){ if(!S.user) return go("auth"); workshopsView(); },
  "account": function(){ if(!S.user) return go("auth"); accountView(); }
};

function route(){
  var rawHash = (location.hash || "").slice(1);
  window.scrollTo(0, 0);

  // Clean route name if extra tokens or hashes are present
  var clean = rawHash.split("#")[0].split("&")[0];

  if (clean.indexOf("workshop-") === 0) {
    if (!S.user) return go("auth");
    var rest = clean.slice(9);
    var slashParts = rest.split("/");
    var wid = slashParts[0];
    var subview = slashParts[1] || "tree";
    var sessionParam = slashParts[2] ? parseInt(slashParts[2], 10) : null;
    workshopView(wid, subview, sessionParam);
    hud();
    return;
  }

  if (clean === "account") {
    if (!S.user) return go("auth");
    accountView();
    hud();
    return;
  }

  if (clean === "auth" && S.user) return go("workshops");

  hud();
  (ROUTES[clean] || welcome)();
}

addEventListener("hashchange", route);

// Initialize on page load
(async function init(){
  // 1. Check for error in hash
  if (location.hash && location.hash.includes("error_description")) {
    var raw = location.hash.slice(1);
    var pStart = raw.indexOf("error_description=");
    var pms = new URLSearchParams(raw.substring(pStart));
    var desc = pms.get("error_description");
    if (desc) {
      say(decodeURIComponent(desc.replace(/\+/g, " ")), 5000);
      history.replaceState(null, "", location.pathname);
    }
  }

  // 2. Check for recovery / access_token in hash (handles double hash like #account#access_token=)
  if (location.hash && location.hash.includes("access_token=") && sb) {
    var rawH = location.hash;
    var atPos = rawH.indexOf("access_token=");
    var tokenPart = rawH.substring(atPos);
    var tokenParams = new URLSearchParams(tokenPart);
    var at = tokenParams.get("access_token");
    var rt = tokenParams.get("refresh_token") || at;
    var type = tokenParams.get("type");
    if (at) {
      try {
        var setRes = await sb.auth.setSession({ access_token: at, refresh_token: rt });
        if (setRes.data && setRes.data.session) {
          S.user = setRes.data.session.user;
          if (type === "recovery") {
            S.needPw = true;
            await refreshAuth();
            hud();
            history.replaceState(null, "", location.pathname + "#account");
            accountView();
            say("Recovery link verified! Please enter your new password below.", 5000);
            return;
          } else {
            // Google OAuth sign-in or normal login: redirect directly to workshops level map!
            await refreshAuth();
            hud();
            history.replaceState(null, "", location.pathname + "#workshops");
            workshopsView();
            say("Signed in successfully!");
            return;
          }
        }
      } catch(err) {
        console.warn("Session hash parse notice:", err);
      }
    }
  }

  // 3. Listen to auth changes (e.g. password recovery or OAuth sign-in)
  if (sb) {
    sb.auth.onAuthStateChange(async function(event, session){
      if (event === "PASSWORD_RECOVERY") {
        S.needPw = true;
        if (session && session.user) S.user = session.user;
        await refreshAuth();
        hud();
        go("account");
        say("Recovery link verified. Please enter your new password below.", 5000);
      } else if (event === "SIGNED_IN") {
        if (!S.user && session && session.user) {
          S.user = session.user;
          await refreshAuth();
          hud();
        }
      }
    });
  }

  await refreshAuth();
  hud();
  route();
})();

})();
</script>
