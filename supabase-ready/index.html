<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>start.here: a free workshop, one level at a time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F3;--panel:#FFFFFF;--ink:#14141A;--muted:#5C5C57;--line:#DAD8D0;--pink:#D4105A;--yellow:#E0A91F;--yshadow:#8F6508;--cyan:#38B6D8;--mint:#BFEBD3;--sun:#F6E3A8;--rose:#F8C6D4;--btn:#14141A;--btn-ink:#FFFFFF;--grid:rgba(20,20,26,.045);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171D;--panel:#1E212A;--ink:#F4F2EA;--muted:#A9AAA3;--line:#2E323D;--pink:#FF4D8D;--yellow:#F2BE3A;--yshadow:#7A5606;--btn:#F4F2EA;--btn-ink:#15171D;--grid:rgba(255,255,255,.04);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171D;--panel:#1E212A;--ink:#F4F2EA;--muted:#A9AAA3;--line:#2E323D;--pink:#FF4D8D;--yellow:#F2BE3A;--yshadow:#7A5606;--btn:#F4F2EA;--btn-ink:#15171D;--grid:rgba(255,255,255,.04);color-scheme:dark}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg) linear-gradient(var(--grid) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/40px 40px;color:var(--ink);font:400 1.0625rem/1.6 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;margin:0;line-height:1}
h2{font-size:clamp(2.4rem,7vw,5rem);letter-spacing:.01em}
h3{font-size:1.4rem;font-weight:500}
p{margin:0}a{color:inherit}
svg.sp{display:block;image-rendering:pixelated;shape-rendering:crispEdges}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:4px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
section{padding:clamp(3.5rem,9vw,6.5rem) 0}
.note{font-family:"Caveat",cursive;font-weight:600;font-size:1.7rem;display:inline-block;position:relative;line-height:1}
.note::after{content:"";position:absolute;left:4%;right:4%;bottom:-6px;height:5px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 2px no-repeat;border-radius:50%;transform:rotate(-1deg)}
.mono{font:500 .78rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:2px solid var(--ink)}
.bar{display:flex;align-items:center;justify-content:space-between;height:58px;gap:.8rem}
.logo{display:flex;align-items:center;gap:.5rem;font:700 1.05rem "Pixelify Sans",monospace;text-decoration:none}
nav.pills{display:flex;gap:.2rem;background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:3px}
nav.pills a{font:500 .72rem ui-monospace,Menlo,monospace;text-decoration:none;padding:.35rem .7rem;border-radius:8px;color:var(--muted)}
nav.pills a b{opacity:.6;margin-right:.3rem}
nav.pills a.on{background:var(--ink);color:var(--bg)}
.hud{display:flex;align-items:center;gap:.7rem}
.hearts{display:flex;gap:3px}
.score{font:600 .78rem ui-monospace,Menlo,monospace;border:2px solid var(--ink);border-radius:8px;padding:.3rem .6rem;white-space:nowrap}
.score b{color:var(--pink);font-weight:600}
.start{display:inline-flex;align-items:center;gap:.4rem;background:var(--pink);color:#fff;font:600 .78rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;border:2px solid var(--ink);border-radius:10px;padding:.5rem .9rem;min-height:40px;box-shadow:3px 3px 0 var(--ink);transition:transform .12s,box-shadow .12s}
.start:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hero{position:relative;text-align:center;padding-top:clamp(3rem,8vw,5.5rem);padding-bottom:0}
.hero .cloud{position:absolute;left:8%;top:2.5rem;opacity:.9}
.frame{position:relative;display:inline-block;padding:clamp(.8rem,2vw,1.4rem) clamp(1rem,3vw,2rem);margin-top:.8rem;background:
 linear-gradient(var(--cyan),var(--cyan)) 0 0/22px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 0/3px 22px no-repeat,
 linear-gradient(var(--cyan),var(--cyan)) 100% 0/22px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 0/3px 22px no-repeat,
 linear-gradient(var(--cyan),var(--cyan)) 0 100%/22px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 0 100%/3px 22px no-repeat,
 linear-gradient(var(--cyan),var(--cyan)) 100% 100%/22px 3px no-repeat,linear-gradient(var(--cyan),var(--cyan)) 100% 100%/3px 22px no-repeat}
h1{font-size:clamp(3.2rem,13vw,9.5rem);letter-spacing:.01em;text-shadow:4px 4px 0 var(--line)}
h1 span{color:var(--yellow);text-shadow:4px 4px 0 var(--yshadow)}
.tag{font:500 .8rem ui-monospace,Menlo,monospace;color:var(--muted);margin-top:1.2rem;display:block}
.tagline{font-size:clamp(1.2rem,3vw,1.6rem);font-weight:500;margin-top:1.4rem;min-height:2.2rem}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--ink);vertical-align:-.18em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.cta{display:flex;gap:1.2rem;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:1.6rem}
.btn{display:inline-flex;align-items:center;gap:.5rem;min-height:48px;padding:.7rem 1.3rem;border-radius:12px;background:var(--btn);color:var(--btn-ink);font:600 .85rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;text-decoration:none;border:0;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.link{font:600 .85rem ui-monospace,Menlo,monospace;text-transform:uppercase;text-decoration:none;letter-spacing:.04em}
.link:hover{text-decoration:underline}
.stk{position:static;display:inline-flex;align-items:center;gap:.4rem;font:600 .72rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.45rem .8rem;border-radius:6px;color:#14141A;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.stks{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin-top:1.4rem}
.s1{background:var(--sun);transform:rotate(-4deg)}.s2{background:var(--rose);transform:rotate(3deg)}.s3{background:var(--mint);transform:rotate(-2deg)}
.ground{position:relative;margin-top:2.5rem;height:130px}
.ground svg.hills{position:absolute;inset:auto 0 0;width:100%;height:100%}
.mascot{position:absolute;left:10%;bottom:34px;background:none;border:0;padding:0;cursor:pointer}
.mascot .note{position:absolute;left:62px;top:-26px;font-size:1.3rem;white-space:nowrap}
.mascot .note::after{display:none}
.mascot.jump svg{animation:jump .5s ease}
@keyframes jump{40%{transform:translateY(-46px)}}
.head{margin-bottom:2.2rem}
.head .mono{display:block;margin-bottom:.7rem}
.head p{color:var(--muted);margin-top:.9rem;max-width:44ch}
.about{display:grid;gap:2.5rem;align-items:center}
.about .head{text-align:center}
.console{justify-self:center;width:min(300px,80vw);background:#38B6D8;border:4px solid #14141A;border-radius:22px 22px 40px 22px;padding:1rem;box-shadow:8px 8px 0 #14141A}
.lcd{background:#B7DF45;border:4px solid #14141A;border-radius:10px;padding:1.2rem 1rem .8rem;display:grid;place-items:center;gap:.5rem;color:#14141A;font:700 .8rem "Pixelify Sans",monospace}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;padding:0 .4rem}
.pad i{display:block;width:14px;height:14px;background:#14141A;border-radius:3px}
.pad b{display:block;width:34px;height:10px;background:#14141A;border-radius:6px;opacity:.7}
.big{font-size:clamp(1.5rem,3.4vw,2.2rem);font-weight:500;line-height:1.3;letter-spacing:-.01em}
mark{border-radius:4px;padding:0 .2em;color:inherit}
.m1{background:#F6E3A8}.m2{background:#BFEBD3}.m3{background:#F8C6D4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) mark{color:#14141A}}
:root[data-theme="dark"] mark{color:#14141A}
.levels{border-top:2px solid var(--ink)}
.lv{border-bottom:2px solid var(--ink)}
.lv summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem 1fr auto;gap:.8rem;align-items:center;padding:1.1rem .3rem;min-height:64px}
.lv summary::-webkit-details-marker{display:none}
.lv summary h3{font-size:clamp(1.2rem,3vw,1.7rem)}
.lv summary:hover h3{color:var(--pink)}
.lv .go{display:grid;place-items:center;width:38px;height:38px;border:2px solid var(--ink);border-radius:50%;font-weight:600;transition:transform .2s,background .2s}
.lv[open] .go{transform:rotate(90deg);background:var(--ink);color:var(--bg)}
.lv p{padding:0 .3rem 1.3rem 3.4rem;color:var(--muted);max-width:60ch}
.lvhead{display:grid;gap:1.5rem;align-items:center;margin-bottom:2rem}
.you{justify-self:start;text-align:center}
.you .mono{display:block;margin-top:.5rem}
.cards{display:grid;gap:1.6rem}
.card{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:1.5rem;display:flex;flex-direction:column;gap:.8rem}
.card .ic{width:46px;height:46px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font:700 1.1rem "Pixelify Sans",monospace;color:#14141A}
.card p{color:var(--muted);flex:1}
.hs{margin-top:2.5rem;border:3px dashed var(--ink);border-radius:16px;padding:1.6rem;text-align:center}
.hs h3{margin-bottom:.4rem}.hs p{color:var(--muted)}
.faq{max-width:760px;margin-inline:auto}
.faq details{border-top:2px solid var(--ink)}
.faq details:last-of-type{border-bottom:2px solid var(--ink)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;padding:1.1rem 0;min-height:58px;font-weight:600}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:700 1.5rem "Pixelify Sans",monospace;line-height:1}
.faq details[open] summary::after{content:"\2212"}
.faq p{color:var(--muted);padding:0 0 1.2rem;max-width:60ch}
.end{text-align:center}
.end h2{margin:.5rem 0 1.4rem}
footer{border-top:2px solid var(--ink);padding:1.4rem 0;font:500 .8rem ui-monospace,Menlo,monospace;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
footer a{margin-left:1rem;text-decoration:none}footer a:hover{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:10px;max-width:min(92vw,420px);text-align:center;transition:transform .25s ease;z-index:30;font:500 .85rem ui-monospace,Menlo,monospace}
#toast.show{transform:translate(-50%,0)}
[hidden]{display:none!important}
.vwrap{width:min(960px,100% - 2.5rem);margin:0 auto;padding:clamp(2.5rem,7vw,4.5rem) 0 clamp(3rem,8vw,6rem)}
.back{font:600 .8rem ui-monospace,Menlo,monospace;text-decoration:none;text-transform:uppercase;display:inline-block;margin-bottom:1.4rem}
.back:hover{text-decoration:underline}
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:clamp(1.2rem,4vw,2rem)}
.fld{display:grid;gap:.4rem;margin-bottom:1.1rem}
.fld label{font:600 .78rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{font:inherit;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:10px;padding:.7rem .9rem;min-height:48px;width:100%}
.fld textarea{min-height:100px;resize:vertical}
.fld small{color:var(--muted)}
.maplist{display:grid;gap:1.6rem;margin-top:2rem}
.node{display:grid;grid-template-columns:auto 1fr auto;gap:1rem 1.3rem;align-items:center}
.node .lvl{font:700 2.6rem "Pixelify Sans",monospace;color:var(--yellow);text-shadow:3px 3px 0 var(--yshadow);line-height:1}
.node p{color:var(--muted);margin-top:.3rem}
.node.lock{opacity:.6;border-style:dashed;box-shadow:none}
.node.lock .lvl{color:var(--muted);text-shadow:none}
.bar2{height:16px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);overflow:hidden;margin-top:.8rem}
.bar2 i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.stack{display:grid;gap:1.6rem;margin-top:1.8rem}
.stack h3{margin-bottom:.6rem}
.rowlist{list-style:none;margin:.8rem 0 0;padding:0}
.rowlist li{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;padding:.9rem 0;border-top:2px solid var(--line)}
.rowlist input[type=checkbox]{width:28px;height:28px;accent-color:var(--pink);cursor:pointer}
.rowlist label{cursor:pointer}
.rowlist b{font-weight:600}
@media (max-width:600px){.node{grid-template-columns:auto 1fr}.node .btn{grid-column:1/-1;justify-content:center}.node svg.sp{display:none}}
.wgrid{display:grid;gap:1.8rem;margin-top:2rem}
.win{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column}
.wbar{display:flex;align-items:center;gap:.7rem;background:var(--yellow);border-bottom:3px solid var(--ink);padding:.5rem .8rem;color:#14141A}
.dots{display:flex;gap:5px}.dots i{width:11px;height:11px;border-radius:50%;background:#14141A;opacity:.85}
.wt{font:600 .75rem ui-monospace,Menlo,monospace;flex:1}
.wx{font:700 1rem monospace;line-height:1}
.wbody{padding:1.4rem;display:grid;gap:.5rem;align-content:start;flex:1}
.wbody .lvl{font:700 2.6rem "Pixelify Sans",monospace;color:var(--yellow);text-shadow:3px 3px 0 var(--yshadow);line-height:1}
.wbody p{color:var(--muted)}
.wbody .btn{justify-self:start;margin-top:.8rem}
.win.lock{border-style:dashed;box-shadow:none;opacity:.65}
.win.lock .wbar{background:var(--line);color:var(--muted)}
.win.lock .wbody{justify-items:center;text-align:center;padding:2rem 1.3rem}
.way{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:start;padding:.9rem 0;border-top:2px solid var(--line)}
.way:first-child{border-top:0}
.way .ic{width:46px;height:46px;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;font:700 1.1rem "Pixelify Sans",monospace;color:#14141A}
@media (min-width:700px){.wgrid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:860px){
.hero .stks{display:block;margin:0}
.stk{position:absolute}
.s1{left:6%;top:9rem}.s2{right:7%;top:6rem}.s3{left:12%;top:22rem}
.about{grid-template-columns:.8fr 1.2fr;column-gap:3rem}.about .head{grid-column:1/-1}
.lvhead{grid-template-columns:1fr auto}
.cards{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:859px){nav.pills{display:none}}
@media (max-width:600px){.hearts,.logo span{display:none}.hero .cloud{display:none}.score{font-size:.72rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.4rem}
.tabs button{font:600 .8rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.55rem 1rem;border:2px solid var(--ink);border-radius:10px;background:var(--bg);color:var(--ink);cursor:pointer;min-height:44px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.msg{min-height:1.4rem;font:500 .85rem ui-monospace,Menlo,monospace;margin-top:1rem}
.msg.err{color:var(--pink)}
.btn.line{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.row{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}
.sep{display:flex;gap:.8rem;align-items:center;margin:1.2rem 0;color:var(--muted);font:500 .8rem ui-monospace,Menlo,monospace}
.sep::before,.sep::after{content:"";flex:1;height:2px;background:var(--line)}
.notice{border:2px solid var(--pink);border-radius:12px;padding:.8rem 1rem;margin-bottom:1.2rem;font-weight:500}
#hud .mono{max-width:14ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hud button.link{background:none;border:0;cursor:pointer;color:inherit;padding:0}
@media (max-width:700px){#hud .mono,#hud .hide-sm{display:none}}
</style>

  try { await refresh(); track(); if (S.user) log("visit"); } catch (e) {}
  sb.auth.onAuthStateChange(function(ev){ if (ev === "SIGNED_OUT") setTimeout(function(){ S.user = null; S.profile = null; hud(); }, 0); });
  addEventListener("hashchange", route); route();
})();
})();
