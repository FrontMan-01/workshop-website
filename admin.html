<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>start.here — Admin</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8F7F3;--panel:#FFFFFF;--ink:#14141A;--muted:#5C5C57;--line:#DAD8D0;--pink:#D4105A;--yellow:#E0A91F;--yshadow:#8F6508;--cyan:#38B6D8;--mint:#BFEBD3;--sun:#F6E3A8;--rose:#F8C6D4;--btn:#14141A;--btn-ink:#FFFFFF;--green:#2FB36F;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#15171D;--panel:#1E212A;--ink:#F4F2EA;--muted:#A9AAA3;--line:#2E323D;--pink:#FF4D8D;--yellow:#F2BE3A;--yshadow:#7A5606;--btn:#F4F2EA;--btn-ink:#15171D;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Inter",system-ui,sans-serif;min-height:100vh}
h1,h2,h3,h4{font-family:"Pixelify Sans","Courier New",monospace;font-weight:700;margin:0;line-height:1.1}
h2{font-size:clamp(1.8rem,4vw,3rem)} h3{font-size:1.25rem;font-weight:500} h4{font-size:.95rem}
p{margin:0} a{color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.note{font-family:"Caveat",cursive;font-weight:600;font-size:1.4rem;display:inline-block;position:relative;line-height:1}
.note::after{content:"";position:absolute;left:4%;right:4%;bottom:-5px;height:4px;background:linear-gradient(var(--ink),var(--ink)) 0 0/100% 2px no-repeat;border-radius:50%;transform:rotate(-1deg)}
.mono{font:500 .75rem ui-monospace,Menlo,Consolas,monospace;color:var(--muted);letter-spacing:.04em}

/* ── HEADER ── */
header{background:var(--panel);border-bottom:2px solid var(--ink);position:sticky;top:0;z-index:20}
.bar{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 1.4rem;gap:1rem}
.logo{font:700 1rem "Pixelify Sans",monospace;background:none;border:0;cursor:pointer;color:inherit;display:flex;align-items:center;gap:.5rem}
.hud-right{display:flex;align-items:center;gap:.8rem}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:.45rem;min-height:42px;padding:.55rem 1.1rem;border-radius:10px;background:var(--btn);color:var(--btn-ink);font:600 .8rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);cursor:pointer;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn.sm{min-height:34px;padding:.35rem .75rem;font-size:.7rem;box-shadow:2px 2px 0 var(--ink)}
.btn.sm:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.sm:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.btn.line{background:transparent;color:var(--ink)}
.btn.danger{background:#C0392B;color:#fff;border-color:#C0392B}
.btn.success{background:var(--green);color:#fff;border-color:var(--green)}
.btn.warn{background:var(--yellow);color:#14141A;border-color:var(--yshadow)}
.link{font:600 .8rem ui-monospace,Menlo,monospace;text-transform:uppercase;text-decoration:none;background:none;border:0;cursor:pointer;color:inherit;padding:0;letter-spacing:.04em}
.link:hover{text-decoration:underline}

/* ── FORMS ── */
.fld{display:grid;gap:.25rem;margin-bottom:.75rem}
.fld label{font:600 .72rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em}
.fld input,.fld select,.fld textarea{font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:8px;padding:.5rem .75rem;min-height:38px;width:100%}
.fld textarea{min-height:80px;resize:vertical}
.fld small{color:var(--muted);font-size:.78rem}
.fld input[type=checkbox]{width:20px;height:20px;min-height:unset;accent-color:var(--pink);cursor:pointer}
.msg{min-height:1.1rem;font:500 .82rem ui-monospace,Menlo,monospace;margin-top:.7rem}
.msg.err{color:var(--pink)} .msg.ok{color:var(--green)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:1.2rem}

/* ── PANELS ── */
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:clamp(1rem,2.5vw,1.4rem)}
.notice{border:2px solid var(--pink);border-radius:10px;padding:.7rem .9rem;margin-bottom:1rem;font-size:.9rem;font-weight:500}
.notice.info{border-color:var(--cyan)}
.notice.ok{border-color:var(--green)}


/* ── ADMIN LAYOUT ── */
.admin-wrap{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 56px)}
.admin-side{background:var(--panel);border-right:2px solid var(--ink);padding:1rem .7rem;display:flex;flex-direction:column;gap:.15rem;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.section-label{font:600 .62rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.6rem .5rem .25rem;margin-top:.5rem}
.section-label:first-child{margin-top:0}
.aside-btn{display:flex;align-items:center;gap:.55rem;width:100%;background:none;border:0;border-radius:8px;padding:.5rem .65rem;font:500 .83rem "Inter",sans-serif;color:var(--ink);cursor:pointer;text-align:left;transition:background .12s}
.aside-btn:hover{background:var(--bg)}
.aside-btn.on{background:var(--ink);color:var(--bg)}
.aside-btn .ic{font-size:.95rem;width:20px;text-align:center;line-height:1}
.admin-main{padding:clamp(1.2rem,3vw,2rem);overflow-y:auto}

/* ── TABLES ── */
.atbl{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:.7rem}
.atbl th{font:600 .7rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.04em;text-align:left;padding:.55rem .75rem;border-bottom:2px solid var(--ink);white-space:nowrap}
.atbl td{padding:.6rem .75rem;border-bottom:1px solid var(--line);vertical-align:middle}
.atbl tr:hover td{background:var(--bg)}

/* ── STATS ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.9rem;margin-bottom:1.6rem}
.stat-card{background:var(--panel);border:2px solid var(--ink);border-radius:12px;padding:.9rem 1.1rem;box-shadow:4px 4px 0 var(--ink)}
.stat-card .num{font:700 2rem "Pixelify Sans",monospace;color:var(--pink);line-height:1}
.stat-card .lbl{font:500 .72rem ui-monospace,Menlo,monospace;color:var(--muted);margin-top:.25rem}

/* ── BADGES ── */
.badge{display:inline-block;font:600 .62rem ui-monospace,Menlo,monospace;text-transform:uppercase;padding:.18rem .48rem;border-radius:4px;letter-spacing:.04em}
.badge.open{background:var(--mint);color:#14141A}
.badge.locked{background:var(--line);color:var(--muted)}
.badge.closed{background:var(--rose);color:#14141A}
.badge.admin{background:var(--pink);color:#fff}
.badge.pub{background:var(--mint);color:#14141A}
.badge.draft{background:var(--sun);color:#14141A}

/* ── MODAL ── */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal{background:var(--panel);border:3px solid var(--ink);border-radius:14px;box-shadow:8px 8px 0 var(--ink);padding:1.5rem;width:min(540px,100%);max-height:90vh;overflow-y:auto}
.modal h3{margin-bottom:1.1rem}
.modal-footer{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1.1rem;flex-wrap:wrap}

/* ── TOAST ── */
#toast{position:fixed;left:50%;bottom:1.2rem;transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.75rem 1.1rem;border-radius:10px;max-width:min(92vw,400px);text-align:center;transition:transform .25s;z-index:99;font:500 .83rem ui-monospace,Menlo,monospace}
#toast.show{transform:translate(-50%,0)}

@media(max-width:700px){
  .admin-wrap{grid-template-columns:1fr}
  .admin-side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:2px solid var(--ink);padding:.5rem}
  .aside-btn{width:auto;padding:.4rem .6rem;font-size:.75rem}
  .section-label{display:none}
}
</style>
</head>
<body>

<!-- ══════════════ VERIFYING ACCESS STATE ══════════════ -->
<div id="auth-check-spinner" style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:ui-monospace,Menlo,monospace;gap:.8rem;background:var(--bg)">
  <span style="font-size:2.2rem">🔐</span>
  <p style="font-weight:700;font-size:1.05rem;color:var(--ink);margin:0">Verifying administrator access...</p>
  <span class="mono" style="font-size:.8rem;color:var(--muted)">Checking authorized credentials</span>
</div>

<!-- ══════════════ ADMIN APP (hidden until login) ══════════════ -->
<div id="admin-app" hidden>
  <header>
    <div class="bar">
      <button class="logo" onclick="showTab('overview')">⚙ start.here admin</button>
      <div class="hud-right">
        <span class="mono" id="admin-email-display"></span>
        <a class="btn sm line" href="/" target="_blank">Student Site ↗</a>
        <button class="btn sm danger" id="btn-admin-signout" onclick="adminLogout()">Sign out</button>
      </div>
    </div>
  </header>
  <div class="admin-wrap">
    <div class="admin-side" id="admin-side"></div>
    <div class="admin-main" id="admin-main"></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

var C = window.APP_CONFIG || {};
var sb = (window.supabase && C.SUPABASE_URL && C.SUPABASE_KEY)
  ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_KEY)
  : null;

var adminUser = null;
var adminProfile = null;

var DB = {
  workshops: [],
  sessions: {},
  live_links: {},
  competitions: {},
  students: [],
  enrollments: [],
  events: []
};

var $ = function(id){ return document.getElementById(id); };
var toastEl = $("toast"), tt;

function say(m){
  toastEl.textContent = m;
  toastEl.classList.add("show");
  clearTimeout(tt);
  tt = setTimeout(function(){ toastEl.classList.remove("show"); }, 3000);
}

function pad2(n){ return (n < 10 ? "0" : "") + n; }
function fmt(t){ return t ? new Date(t).toLocaleString([], {dateStyle:"medium", timeStyle:"short"}) : "TBA"; }
function fmtDate(t){ return t ? new Date(t).toLocaleDateString([], {dateStyle:"medium"}) : "—"; }
function wName(id){ var w = DB.workshops.find(function(x){ return x.id === id; }); return w ? w.title : id; }

function h(tag, props){
  var e = document.createElement(tag), k, kids = Array.prototype.slice.call(arguments, 2);
  props = props || {};
  for(k in props){
    var v = props[k];
    if(k === "class") e.className = v;
    else if(k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);
    else if(v === true) e.setAttribute(k, "");
    else if(v !== false && v != null) e.setAttribute(k, v);
  }
  (function add(list){
    list.forEach(function(c){
      if(Array.isArray(c)) return add(c);
      if(c == null || c === false) return;
      e.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    });
  })(kids);
  return e;
}

function msgBox(){ return h("p", {class:"msg"}); }
function setMsg(el, t, ok){ el.textContent = t || ""; el.className = "msg" + (ok === true ? " ok" : ok === false ? " err" : ""); }

function fld(id, label, attrs, hint){
  return h("div", {class:"fld"},
    h("label", {for:id}, label),
    h("input", Object.assign({id:id}, attrs)),
    hint ? h("small", null, hint) : null
  );
}

function selectFld(id, label, options, val){
  var sel = h("select", {id:id}, options.map(function(o){
    var opt = h("option", {value:o.v}, o.l);
    if(o.v === val) opt.selected = true;
    return opt;
  }));
  return h("div", {class:"fld"}, h("label", {for:id}, label), sel);
}

function showModal(content, onClose){
  var root = $("modal-root");
  var bg = h("div", {class:"modal-bg", onclick:function(e){ if(e.target === bg){ root.replaceChildren(); if(onClose) onClose(); } }},
    h("div", {class:"modal"}, content));
  root.replaceChildren(bg);
}
function closeModal(){ $("modal-root").replaceChildren(); }

/* ══════════════════════════════════════════════
   DATA FETCHING FROM SUPABASE
══════════════════════════════════════════════ */
async function loadDbData(){
  if (!sb) return;
  try {
    var res = await Promise.all([
      sb.from("workshops").select("*").order("level_no"),
      sb.from("sessions").select("*").order("position"),
      sb.from("workshop_links").select("*"),
      sb.from("competitions").select("*").order("created_at"),
      sb.from("profiles").select("*").order("created_at", { ascending: false }),
      sb.from("enrollments").select("*"),
      sb.from("events").select("*").order("created_at", { ascending: false }).limit(50)
    ]);

    DB.workshops = res[0].data || [];
    
    // Group sessions by workshop_id
    DB.sessions = {};
    (res[1].data || []).forEach(function(s){
      if(!DB.sessions[s.workshop_id]) DB.sessions[s.workshop_id] = [];
      DB.sessions[s.workshop_id].push(s);
    });

    // Group live links by workshop_id
    DB.live_links = {};
    (res[2].data || []).forEach(function(l){
      DB.live_links[l.workshop_id] = l.live_url;
    });

    // Group competitions by workshop_id
    DB.competitions = {};
    (res[3].data || []).forEach(function(c){
      if(!DB.competitions[c.workshop_id]) DB.competitions[c.workshop_id] = [];
      DB.competitions[c.workshop_id].push(c);
    });

    // Enrich profiles with enrolled workshop IDs
    var enrollments = res[5].data || [];
    DB.enrollments = enrollments;

    var studentList = res[4].data || [];
    DB.students = studentList.map(function(p){
      var enrolledWids = enrollments.filter(function(e){ return e.user_id === p.id; }).map(function(e){ return e.workshop_id; });
      return {
        id: p.id,
        full_name: p.full_name || "(Anonymous)",
        email: p.email || (p.full_name ? p.full_name + "@student" : "student"),
        phone: p.phone || "",
        year: p.year || "",
        why: p.why || "",
        role: p.role || "student",
        joined: p.created_at,
        enrolled: enrolledWids
      };
    });

    DB.events = (res[6].data || []).map(function(e){
      return {
        id: e.id,
        type: e.type,
        workshop_id: e.workshop_id,
        workshop: wName(e.workshop_id),
        user_id: e.user_id,
        at: e.created_at
      };
    });

  } catch(err) {
    console.error("Error loading database data:", err);
    say("Database sync error: " + err.message);
  }
}

/* ══════════════════════════════════════════════
   ADMIN CONTROL ROOM INITIALIZATION
══════════════════════════════════════════════ */
async function showAdminApp(){
  var spinner = $("auth-check-spinner");
  if (spinner) spinner.remove();
  $("admin-app").hidden = false;
  $("admin-email-display").textContent = adminUser ? adminUser.email : "Admin";

  await loadDbData();
  buildSidebar();
  showTab("overview");
}

async function adminLogout(){
  if (sb) {
    try { await sb.auth.signOut(); } catch(e){}
  }
  adminUser = null;
  adminProfile = null;
  window.location.replace("/");
}
window.adminLogout = adminLogout;
window.showTab = showTab;
window.showAdminApp = showAdminApp;

var soBtn = $("btn-admin-signout");
if (soBtn) soBtn.addEventListener("click", adminLogout);

/* ══════════════════════════════════════════════
   SIDEBAR & TABS
══════════════════════════════════════════════ */
var currentTab = "overview";

function buildSidebar(){
  var side = $("admin-side");
  side.replaceChildren();
  function sbBtn(tab, icon, label){
    var b = h("button", {class:"aside-btn", onclick:function(){ showTab(tab); }},
      h("span", {class:"ic"}, icon), " " + label);
    b.dataset.tab = tab;
    return b;
  }
  side.append(
    h("div", {class:"section-label"}, "Dashboard"),
    sbBtn("overview", "📊", "Overview"),
    h("div", {class:"section-label"}, "Database Content"),
    sbBtn("workshops", "🏫", "Workshops"),
    sbBtn("sessions", "📅", "Sessions"),
    sbBtn("livelinks", "🔴", "Live Links"),
    sbBtn("competitions", "🏆", "Competitions"),
    h("div", {class:"section-label"}, "Students"),
    sbBtn("students", "👥", "All Students"),
    sbBtn("registrations", "📋", "Registrations"),
    h("div", {class:"section-label"}, "System"),
    sbBtn("analytics", "📈", "Events Log"),
    h("div", {class:"section-label"}, "Admin Security"),
    sbBtn("password", "🔑", "Change Password")
  );
}

async function showTab(tab){
  currentTab = tab;
  var side = $("admin-side");
  if(side) side.querySelectorAll(".aside-btn").forEach(function(b){ b.classList.toggle("on", b.dataset.tab === tab); });
  var main = $("admin-main");
  main.replaceChildren();

  var MAP = {
    overview: tabOverview,
    workshops: tabWorkshops,
    sessions: tabSessions,
    livelinks: tabLiveLinks,
    competitions: tabCompetitions,
    students: tabStudents,
    registrations: tabRegistrations,
    analytics: tabAnalytics,
    password: tabChangePassword
  };

  (MAP[tab] || tabOverview)(main);
}

/* ══════════════════════════════════════════════
   TAB: OVERVIEW
══════════════════════════════════════════════ */
function statCard(num, icon, label){
  return h("div", {class:"stat-card"},
    h("div", {class:"num"}, icon + " " + num),
    h("div", {class:"lbl"}, label)
  );
}

function tabOverview(main){
  main.replaceChildren();
  var totalStudents = DB.students.length;
  var totalEnrollments = DB.enrollments.length;
  var pubWorkshops = DB.workshops.filter(function(w){ return w.published; }).length;
  var totalSessions = Object.values(DB.sessions).reduce(function(acc, s){ return acc + s.length; }, 0);

  main.append(
    h("span", {class:"note"}, "control room"),
    h("h2", {style:"margin:.4rem 0 1.2rem"}, "Overview"),
    h("div", {class:"stat-grid"},
      statCard(totalStudents, "👥", "Total Students"),
      statCard(totalEnrollments, "📋", "Total Enrollments"),
      statCard(pubWorkshops + "/" + DB.workshops.length, "🏫", "Published Levels"),
      statCard(totalSessions, "📅", "Total Sessions"),
      statCard(DB.events.length, "⚡", "Tracked Events")
    ),
    h("div", {style:"display:flex;justify-content:space-between;align-items:center;margin:1.4rem 0 .7rem"},
      h("h3", null, "Recent Registered Students"),
      h("button", {class:"btn sm line", onclick:async function(){ await loadDbData(); tabOverview(main); say("Refreshed!"); }}, "↻ Refresh Data")
    ),
    h("table", {class:"atbl"},
      h("thead", null, h("tr", null,
        h("th", null, "Name"),
        h("th", null, "Phone / WhatsApp"),
        h("th", null, "Year"),
        h("th", null, "Joined"),
        h("th", null, "Enrolled Levels")
      )),
      h("tbody", null, DB.students.slice(0, 10).map(function(stu){
        return h("tr", null,
          h("td", null, h("b", null, stu.full_name)),
          h("td", null, stu.phone ? h("a", {href:"https://wa.me/91" + stu.phone, target:"_blank", class:"link"}, stu.phone) : h("span", {class:"mono"}, "—")),
          h("td", null, stu.year || "—"),
          h("td", null, h("span", {class:"mono"}, fmtDate(stu.joined))),
          h("td", null, stu.enrolled.length ? h("span", {class:"badge pub"}, stu.enrolled.length + " levels") : h("span", {class:"mono"}, "None"))
        );
      }))
    )
  );
}

/* ══════════════════════════════════════════════
   TAB: WORKSHOPS
══════════════════════════════════════════════ */
function tabWorkshops(main){
  function render(){
    main.replaceChildren();
    main.append(
      h("div", {class:"row", style:"justify-content:space-between;margin-bottom:1.2rem;flex-wrap:wrap;gap:.6rem"},
        h("h2", null, "Workshops"),
        h("button", {class:"btn", onclick:function(){ workshopModal(null); }}, "+ Add Workshop")
      ),
      h("table", {class:"atbl"},
        h("thead", null, h("tr", null,
          h("th", null, "Level"),
          h("th", null, "Title"),
          h("th", null, "Sessions"),
          h("th", null, "Status"),
          h("th", null, "Actions")
        )),
        h("tbody", null, DB.workshops.map(function(w){
          var sc = (DB.sessions[w.id] || []).length;
          return h("tr", null,
            h("td", null, h("span", {class:"mono"}, "LV " + pad2(w.level_no))),
            h("td", null, h("b", null, w.title), h("br"), h("span", {class:"mono"}, w.description)),
            h("td", null, h("span", {class:"mono"}, sc + " sessions")),
            h("td", null, h("span", {class:"badge " + (w.published ? "pub" : "draft")}, w.published ? "Published" : "Draft")),
            h("td", null, h("div", {class:"row"},
              h("button", {class:"btn sm line", onclick:function(){ workshopModal(w); }}, "Edit"),
              h("button", {class:"btn sm " + (w.published ? "warn" : "success"), onclick:async function(){
                var nextState = !w.published;
                var res = await sb.from("workshops").update({ published: nextState }).eq("id", w.id);

    fld("np-2", "Confirm New Password", {type:"password", required:true, minlength:"8", placeholder:"Repeat new password"}),
    h("button", {class:"btn", type:"submit", style:"margin-top:.4rem"}, "Update Password ▶"),
    msg
  );

  form.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var p1 = $("np-1").value;
    var p2 = $("np-2").value;
    if (p1 !== p2) {
      return setMsg(msg, "Passwords do not match.", false);
    }
    if (p1.length < 8) {
      return setMsg(msg, "Password must be at least 8 characters.", false);
    }

    setMsg(msg, "Updating password in Supabase...");
    try {
      var res = await sb.auth.updateUser({ password: p1 });
      if (res.error) {
        setMsg(msg, res.error.message, false);
      } else {
        $("np-1").value = "";
        $("np-2").value = "";
        setMsg(msg, "Password updated successfully in database! ✓", true);
        say("Admin password updated!");
      }
    } catch(err) {
      setMsg(msg, err.message, false);
    }
  });

  main.replaceChildren();
  main.append(
    h("span", {class:"note"}, "admin security"),
    h("h2", {style:"margin:.4rem 0 1.2rem"}, "Change Password"),
    form
  );
}

/* ══════════════════════════════════════════════
   INIT / ENFORCE ADMIN PRE-AUTHENTICATION
══════════════════════════════════════════════ */
(async function init(){
  if (!sb) {
    window.location.replace("/");
    return;
  }
  try {
    var res = await sb.auth.getSession();
    var session = res.data && res.data.session;
    if (!session || !session.user) {
      window.location.replace("/");
      return;
    }

    var pRes = await sb.from("profiles").select("*").eq("id", session.user.id).maybeSingle();
    if (pRes.data && pRes.data.role === "admin") {
      adminUser = session.user;
      adminProfile = pRes.data;
      await showAdminApp();
    } else {
      window.location.replace("/");
    }
  } catch(e){
    window.location.replace("/");
  }
})();

})();
</script>
